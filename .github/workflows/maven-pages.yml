name: Publish Maven repository to Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/maven-pages.yml
  workflow_dispatch:

concurrency:
  group: maven-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'y271727uy/Computatio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.1.0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Maven repository
        run: ./gradlew --no-daemon publishMavenJavaPublicationToLocalRepository -PreleaseTag=v0.1.0

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public Maven repository
        id: deployment
        uses: actions/deploy-pages@v4
