name: Publish Maven repository to Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/maven-pages.yml
  workflow_dispatch:

concurrency:
  group: maven-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'y271727uy/Computatio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out v0.1.0
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.1.0
          path: releases/0.1.0
          persist-credentials: false

      - name: Check out published 0.1.1
        uses: actions/checkout@v4
        with:
          ref: a1699d797e99071d3b78bc7767dde61cb8f38239
          path: releases/0.1.1
          persist-credentials: false

      - name: Check out published 0.1.2
        uses: actions/checkout@v4
        with:
          ref: a6cdf8ce761f67851cae8d3b08f05a805d67be65
          path: releases/0.1.2
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Maven repository
        run: |
          mkdir -p build/repo
          for version in 0.1.0 0.1.1 0.1.2; do
            mkdir -p "releases/$version/build/repo"
            cp -a build/repo/. "releases/$version/build/repo/"
            (cd "releases/$version" && ./gradlew --no-daemon publishMavenJavaPublicationToLocalRepository "-PreleaseTag=v$version")
            cp -a "releases/$version/build/repo/." build/repo/
          done
          ./gradlew --no-daemon publishMavenJavaPublicationToLocalRepository -PreleaseTag=v0.1.3

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public Maven repository
        id: deployment
        uses: actions/deploy-pages@v4
