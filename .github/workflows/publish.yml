name: Publish to Maven

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maven-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'y271727uy/Computatio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish Maven package
        env:
          ORG_GRADLE_PROJECT_cjsahUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_cjsahPassword: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            mode="-PreleaseTag=$GITHUB_REF_NAME"
          else
            mode="-Psnapshot"
          fi
          ./gradlew --no-daemon publishMavenJavaPublicationToCjsahRepository "$mode"
