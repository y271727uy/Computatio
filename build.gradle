plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.y271727uy'
version = '0.1.2'

def releaseTag = providers.gradleProperty('releaseTag').orNull
if (releaseTag != null && releaseTag != "v${version}".toString()) {
    throw new GradleException("Release tag '${releaseTag}' must match v${version}.")
}

base {
    archivesName = 'computatio'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api 'it.unimi.dsi:fastutil:8.5.12'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // All tests are switched off for now so `build` only compiles and packages; delete this line to run them again.
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'computatio'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
        if (releaseTag != null) {
            maven {
                name = 'githubPackages'
                url = uri('https://maven.pkg.github.com/y271727uy/Computatio')
                credentials(PasswordCredentials)
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
